# The address on which the server should listen.
webserver_address = "[::]:3009"

# The Fabric ID to use for the Matter Controller.
matter_fabric_id = 2000

# The file in which to store Matter controller state.
matter_data_path = "matter-influx/controller-state.bin"

# The directory of PAA root certificates.
paa_dir = "/usr/share/matter-influx/paa-root-certs"

# The directory of CD certificates.
cd_dir = "/usr/share/matter-influx/cd-certs"

[influxdb]
# The URL of the InfluxDB to which to connect.
url = "http://localhost:8086"
# The username with which to authenticate to InfluxDB, if any.
#username = ""
# The password with which to authenticate to InfluxDB, if any.
#password = ""
# The name of the InfluxDB database to which to write data.
database = "matter"
