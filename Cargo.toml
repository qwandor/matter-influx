[package]
name = "matter-influx"
version = "0.1.0"
edition = "2024"
authors = ["Andrew Walbran <qwandor@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Matter controller to log values to InfluxDB."
repository = "https://github.com/qwandor/matter-influx/"
keywords = ["matter", "influxdb"]
categories = ["network-programming"]

[dependencies]
askama = "0.16.0"
axum = { version = "0.8.9", features = ["macros"] }
eyre = "0.6.14"
futures = "0.3.34"
influx_db_client = { version = "0.7.0", default-features = false, features = [
  "reqwest",
] }
log = "0.4.34"
matter-clusters = "0.5.0"
matter-controller = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[package.metadata.deb]
section = "net"
maintainer-scripts = "debian-scripts"
assets = [
  [
    "target/release/matter-influx",
    "usr/bin/",
    "755",
  ],
  [
    "matter-influx.example.toml",
    "etc/matter-influx.toml",
    "640",
  ],
  [
    "README.md",
    "usr/share/doc/matter-influx/",
    "644",
  ],
  [
    "certificates/cd-certs/*",
    "usr/share/matter-influx/certificates/cd-certs",
    "644",
  ],
  [
    "certificates/paa-root-certs/*",
    "usr/share/matter-influx/certificates/paa-root-certs",
    "644",
  ],
]

# This section needs to be here even if it's empty, for the systemd integration to work.
[package.metadata.deb.systemd-units]
